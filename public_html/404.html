<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | RankRise USA</title>
  <meta name="description" content="The requested page could not be found on RankRise USA. Explore our services or return to our homepage." />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05070a;
      --card: #080b11;
      --gold: #EAB308;
      --gold-light: #FACC15;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }
    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(234, 179, 8, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(80px);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 10;
      max-width: 640px;
      width: 100%;
      text-align: center;
      background: rgba(8, 11, 17, 0.85);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 48px 32px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.25);
      border-radius: 9999px;
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    h1 {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 16px;
    }
    .gold-text {
      background: linear-gradient(135deg, #FACC15 0%, #EAB308 50%, #CA8A04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-style: italic;
    }
    p {
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 9999px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .btn-primary {
      background: var(--gold);
      color: #05070a;
      box-shadow: 0 10px 30px rgba(234, 179, 8, 0.25);
      border: none;
    }
    .btn-primary:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(234, 179, 8, 0.4);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(234, 179, 8, 0.3);
      transform: translateY(-2px);
    }
    .logo {
      margin-bottom: 24px;
      height: 38px;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="container">
    <a href="/">
      <img src="/assets/images/logo1.webp" alt="RankRise USA" class="logo" />
    </a>
    <div>
      <div class="badge">Error 404 • Page Missing</div>
    </div>
    <h1>Lost in <span class="gold-text">Space?</span></h1>
    <p>The page or resource you are looking for has been moved, renamed, or is temporarily unavailable.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">
        ← Return Home
      </a>
      <a href="/services" class="btn btn-secondary">
        Explore Services →
      </a>
    </div>
  </div>
</body>
</html>
